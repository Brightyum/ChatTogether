<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 | ETA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
  <script defer src="{{ url_for('static', filename='js/signup.js') }}"></script>
</head>
<body>
  <div class="form-container">
    <h2>회원가입</h2>

    <!-- flash 메시지 표시 영역 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-messages">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/signup" id="signup-form">

      <!-- 아이디 입력 및 중복확인 버튼 -->
      <label for="client_id">아이디</label>
      <div class="input-with-button">
        <input type="text" id="client_id" name="client_id" maxlength="8" required>
        <button type="button" id="check-id-btn">중복확인</button>
      </div>
      <small id="id-check-msg"></small>

      <!-- 비밀번호 -->
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" maxlength="8" required>

      <!-- 비밀번호 확인 -->
      <label for="password-check">비밀번호 확인</label>
      <input type="password" id="password-check" name="password_check" maxlength="8" required>

      <small id="pw-check-msg"></small>

      <!-- 이름 -->
      <label for="client_name">이름</label>
      <input type="text" id="client_name" name="client_name" required>

      <!-- 나이 -->
      <label for="client_old">나이</label>
      <input type="number" id="client_old" name="client_old" required>

      <!-- 성별 -->
      <label for="client_gender">성별</label>
      <select id="client_gender" name="client_gender" required>
        <option value="">성별 선택</option>
        <option value="male">남성</option>
        <option value="female">여성</option>
      </select>

      <!-- 이메일 -->
      <label for="client_email">이메일</label>
      <input type="email" id="client_email" name="client_email" required>

      <!-- 전화번호 -->
      <label for="phone">전화번호</label>
      <input type="tel" id="phone" name="phone"  placeholder="01012345678" maxlength="11" required>
      <small class="form-text text-muted">※ 하이픈(-) 없이 숫자만 입력하세요.</small>

      <!-- 학교 -->
      <label for="school">학교</label>
      <input type="text" id="school" name="school" required>


      <!-- 회원가입 버튼 -->
      <button type="submit">회원가입</button>
    </form>

    <p class="form-footer">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
  </div>
</body>
</html>
