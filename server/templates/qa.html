<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETA | Q&A 시스템</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/qa.css') }}">
</head>
<body>
  <div class="sidebar-toggle-wrapper">
    <button class="toggle-button" id="toggleSidebar" title="사이드바 열기">☰</button>
  </div>

  <div class="container">
    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar">
      <!-- 팀 목록 -->
    <h2>팀 목록</h2>
    <ul>
    {% for team in teams %}
    <li>{{ team }}</li>
    {% endfor %}
    </ul>

      <h2>저장된 프롬프트</h2>
      <ul>
        <li>자주 묻는 질문</li>
        <li>보고서 템플릿</li>
        <li>코드 리뷰 지침</li>
      </ul>
      <h2>팀 질문 목록</h2>
      <ul>
        <li>DB 구조 질문</li>
        <li>API 설계 기준</li>
        <li>배포 방식</li>
      </ul>
    </aside>

    <!-- 메인 영역 -->
    <main class="main" id="main">

      <!-- 버튼 그룹 -->
      <div class="navigation-buttons">
        <a href="{{ url_for('add_prompt') }}" class="nav-btn">프롬프트 추가</a>
        <a href="{{ url_for('invite_member') }}" class="nav-btn">팀원 초대</a>
        <a href="{{ url_for('create_team') }}" class="nav-btn">팀 추가</a>
      </div>

      <!-- 대화 로그 -->
      <div class="chat-log" id="chat-log">
        <!-- 채팅 내용이 여기에 누적됨 -->
      </div>

      <!-- 질문 입력 -->
      <form class="input-box" onsubmit="handleSubmit(event)">
        <input type="text" placeholder="질문을 입력하세요..." id="question-input" required />
        <button type="submit">➤</button>
      </form>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/qa.js') }}"></script>
  <a href="{{ url_for('export_qna_json') }}" class="nav-btn">QnA JSON 저장</a>

</body>
</html>
